<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izin Siswa - MTsS. An-Nashr</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#1f8a4c;--bd:#dfe3ec;--no:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mu:#9aa3b5;--ac:#3dbb73;--bd:#323848}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.hd img{width:64px;height:64px;border-radius:50%;background:#fff;border:1px solid var(--bd)}
.sk{font-size:22px;font-weight:700;line-height:1.2}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.sg{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
#sug{max-height:260px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px}.chk input{width:auto;margin-top:4px}
.go{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.go:disabled{opacity:.6}.msg{margin-top:10px;font-size:15px}.err{color:var(--no)}.ok{color:var(--ac)}
</style></head><body><main>
<header class="hd"><img src="logo.png" alt="Logo MTsS. An-Nashr" onerror="this.style.display='none'"><div><div class="sk">MTsS. An-Nashr</div><div class="mu">Laporan Izin Siswa</div></div></header>
<div class="card">
<p class="mu" style="margin:0">Diisi oleh orang tua/wali. Kolom bertanda * wajib diisi.</p>
<label>Nama lengkap siswa *</label><input id="nama" autocomplete="off" placeholder="Ketik nama, lalu pilih dari saran">
<div id="nh" class="mu" style="margin-top:4px"></div><div id="sug"></div>
<label>Kelas *</label><input id="kelas" autocomplete="off" placeholder="mis. 7A">
<label>Nama orang tua/wali *</label><input id="ortu">
<label>Hubungan *</label><select id="hub"><option>Ayah</option><option>Ibu</option><option>Wali</option></select>
<label>No. HP aktif *</label><input id="hp" inputmode="tel">
<label>Jenis izin *</label><select id="jenis"><option>Tidak masuk sekolah</option><option>Pulang lebih awal</option><option>Kegiatan di luar sekolah</option></select>
<label>Tanggal izin *</label><input id="tgl" type="date">
<label>Alasan *</label><select id="alasan"><option>Sakit</option><option>Urusan keluarga</option><option>Kegiatan lain</option></select>
<label>Keterangan tambahan</label><textarea id="ket" rows="3"></textarea>
<label>Foto surat sakit/bukti pendukung (opsional)</label><input id="foto" type="file" accept="image/*">
<label class="chk"><input type="checkbox" id="ok"><span>Saya menyatakan bahwa data yang saya isi adalah benar.</span></label>
<div id="msg" class="msg"></div>
<button class="go" id="kirim">Kirim Laporan Izin</button>
</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbybM6HhZ6tnOCQHY9PY7c-uEtKYNg_N1fVGjRWKKLB8434VmlPVkC0JPR37izv0jQWunA/exec';
var $=function(i){return document.getElementById(i)},tm=null,seq=0;
(function(){var d=new Date();$('tgl').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)})();
function sug(){clearTimeout(tm);var n=++seq;tm=setTimeout(function(){
  var q=$('nama').value.trim(),k=$('kelas').value.trim();
  if(!q&&!k){$('sug').innerHTML='';$('nh').textContent='';return}
  fetch(API+'?aksi=cari&q='+encodeURIComponent(q)+'&kelas='+encodeURIComponent(k))
    .then(function(r){return r.json()})
    .then(function(a){if(n===seq)tampil(a)})
    .catch(function(){})},250)}
function tampil(a){
  var B=$('sug');B.innerHTML='';$('nh').textContent='';
  if(!a.length){if($('nama').value.trim().length>=2)$('nh').textContent='Nama belum ada di daftar. Periksa penulisan.';return}
  a.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='sg';b.textContent=x.nama+' \u00b7 Kelas '+x.kelas;
    b.onclick=function(){$('nama').value=x.nama;$('kelas').value=x.kelas;B.innerHTML='';$('nh').textContent=''};B.appendChild(b)});
}
$('nama').oninput=sug;$('nama').onfocus=sug;$('kelas').oninput=sug;
function kecil(f){return new Promise(function(ok,no){
  var r=new FileReader();r.onerror=function(){no()};
  r.onload=function(){var im=new Image();im.onerror=function(){no()};im.onload=function(){
    var w=1100,q=.7,out;
    for(var i=0;i<6;i++){
      var k=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);if(out.length<300000)return ok(out);w*=.8;q-=.08}
    no()};im.src=r.result};r.readAsDataURL(f)})}
function pesan(t,ok){var m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err')}
function tampilkanBukti(d){
  var waktu=new Date().toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'});
  var teks='*BUKTI IZIN SISWA*\nNama: '+d.nama+'\nKelas: '+d.kelas+'\nJenis izin: '+d.jenis+'\nAlasan: '+d.alasan+'\nTanggal izin: '+d.tgl+'\nOrang tua/wali: '+d.ortu+'\nWaktu isi: '+waktu;
  var b=$('bukti');
  if(!b){b=document.createElement('div');b.id='bukti';b.className='card';b.style.marginTop='14px';$('msg').parentNode.appendChild(b)}
  b.innerHTML='';
  var h=document.createElement('b');h.textContent='Bukti pengisian';
  var p=document.createElement('pre');p.style.whiteSpace='pre-wrap';p.textContent=teks;
  var a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(teks);a.target='_blank';a.className='go';a.style.cssText='display:block;text-align:center;text-decoration:none';a.textContent='Kirim bukti ke WhatsApp';
  b.appendChild(h);b.appendChild(p);b.appendChild(a);
}
$('kirim').onclick=async function(){
  var g=function(i){return $(i).value.trim()};
  var d={nama:g('nama'),kelas:g('kelas'),ortu:g('ortu'),hub:g('hub'),hp:g('hp'),jenis:g('jenis'),tgl:g('tgl'),alasan:g('alasan'),ket:g('ket')};
  if(!d.nama||!d.kelas||!d.ortu||!d.hp||!d.tgl)return pesan('Lengkapi semua kolom wajib.');
  if(!$('ok').checked)return pesan('Centang pernyataan terlebih dahulu.');
  var f=$('foto').files[0];
  if(f){if(f.type.indexOf('image/')!==0)return pesan('Lampiran harus berupa foto/gambar.');
    try{d.foto=await kecil(f)}catch(e){return pesan('Foto tidak dapat diproses. Coba foto lain.')}}
  $('kirim').disabled=true;pesan('Mengirim...',true);
  // Tanpa header Content-Type agar dikirim sebagai text/plain (tidak memicu preflight CORS)
  fetch(API,{method:'POST',body:JSON.stringify(d)})
    .then(function(r){return r.json()})
    .then(function(res){
      if(!res||!res.ok)throw new Error((res&&res.pesan)||'Gagal mengirim. Coba lagi.');
      ['nama','kelas','ortu','hp','ket','foto'].forEach(function(i){$(i).value=''});$('ok').checked=false;
      $('sug').innerHTML='';$('nh').textContent='';$('kirim').disabled=false;pesan('Laporan terkirim. Terima kasih.',true);tampilkanBukti(d);
    })
    .catch(function(e){$('kirim').disabled=false;pesan((e&&e.message)||'Gagal mengirim. Coba lagi.')});
};
</script></body></html>
